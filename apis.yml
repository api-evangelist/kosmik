aid: kosmik
name: Kosmik
description: 'Kosmik was an infinite-canvas visual workspace and AI moodboarding app for macOS
  and Windows, published by Lithium Media SAS in Paris and backed by Creandum. It organized work
  into spatial "universes" grouped in shared workspaces, and combined that canvas with a built-in
  web browser, web clipper, PDF reader, drawing and frames, real-time multiplayer collaboration,
  and AI features including auto-tagging, AI search and AI-assisted asset discovery. Kosmik was
  an early mover on local-first storage, shipping an on-device IPFS node with multiplayer in 2018
  and a multiplayer web browser in 2022, before consolidating that work into Kosmik 3 in 2025.
  Kosmik shipped no public API, SDK, CLI or webhook surface, and the product sunset on 31 May
  2026; the vendor now publishes in-app universe and workspace export instructions in place of
  any migration interface.'
